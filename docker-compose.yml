services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-api-app
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      - movie-api-network

  webserver:
    image: nginx:alpine
    container_name: movie-api-webserver
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - movie-api-network

  db:
    image: mysql:8.0
    container_name: movie-api-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: movie_api_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3307:3306"
    volumes:
      - movie-api-db-data:/var/lib/mysql
    networks:
      - movie-api-network

networks:
  movie-api-network:
    driver: bridge

volumes:
  movie-api-db-data:
    driver: local